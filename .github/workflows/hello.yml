name: Hello World Demo

on:
  # 支持在 GitHub 网页界面手动点击运行
  workflow_dispatch:
  # 支持在提交代码到 main 分支时自动运行
  push:
    branches:
      - main

jobs:
  run-hello-script:
    runs-on: ubuntu-latest  # 使用 GitHub 官方开箱即用的 Linux 节点

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 执行 Python 脚本
      - name: Run Hello World Script
        env:
          PYTHONUNBUFFERED: "1"  # 取消输出缓冲，确保日志实时刷新
        run: |
          python scripts/hello.py